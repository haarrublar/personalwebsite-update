[project]
name = "version2"
version = "0.1.0"
description = "python+vite website"
authors = [
    {name = "haarrublar",email = "harrubla.96@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "django-livereload-server (>=0.5.1,<0.6.0)",
    "numpy (>=2.5.2,<3.0.0)",
    "whitenoise (>=6.12.0,<7.0.0)",
    "django-taggit (>=6.1.0,<7.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "djangorestframework (>=3.18.0,<4.0.0)",
    "markdown (>=3.10.3,<4.0.0)",
    "django-filter (>=26.1,<27.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
